<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 霓虹发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 渐变 -->
    <linearGradient id="cyan-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0088cc" />
    </linearGradient>

    <linearGradient id="magenta-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff00ff" />
      <stop offset="100%" stop-color="#8800cc" />
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形（暗色） -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48" fill="#060b1a" />

  <!-- 背景微光边框 -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.15" />

  <!-- ====== 文件夹主体 ====== -->
  <!-- 文件夹下半部分（主体） -->
  <g filter="url(#glow)">
    <path d="M58 136 L58 208 Q58 216 66 216 L190 216 Q198 216 198 208 L198 136 Z"
          fill="none" stroke="url(#cyan-grad)" stroke-width="4" stroke-linejoin="round" />
    
    <!-- 文件夹上半部分（标签页） -->
    <path d="M58 136 L58 92 Q58 84 66 84 L108 84 L124 68 Q128 62 136 62 L190 62 Q198 62 198 70 L198 136"
          fill="none" stroke="url(#cyan-grad)" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- 文件夹内部暗色填充 -->
  <path d="M60 134 L60 206 Q60 214 66 214 L190 214 Q196 214 196 208 L196 134 Z"
        fill="#00f0ff" fill-opacity="0.04" />
  <path d="M60 134 L60 93 Q60 86 66 86 L108 86 L124 70 Q128 64 136 64 L190 64 Q196 64 196 70 L196 134"
        fill="#00f0ff" fill-opacity="0.02" />

  <!-- ====== 文件夹内的文件图标 ====== -->
  <g filter="url(#glow-soft)" fill="none" stroke="#ff00ff" stroke-width="3" stroke-linejoin="round" opacity="0.9">
    <!-- 一个简化的文档形状 -->
    <path d="M100 160 L154 160 L154 196 L100 196 Z" />
    <path d="M108 168 L146 168" stroke-width="2" stroke-opacity="0.6" />
    <path d="M108 176 L138 176" stroke-width="2" stroke-opacity="0.5" />
    <path d="M108 184 L126 184" stroke-width="2" stroke-opacity="0.4" />
  </g>

  <!-- ====== 第二个小文件（错位） ====== -->
  <g filter="url(#glow-soft)" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linejoin="round" opacity="0.5">
    <path d="M76 150 L114 150 L114 178 L76 178 Z" />
    <path d="M82 156 L102 156" stroke-width="1.5" stroke-opacity="0.5" />
    <path d="M82 162 L96 162" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- ====== 装饰性光点 ====== -->
  <g filter="url(#glow)">
    <!-- 左上角光点 -->
    <circle cx="66" cy="84" r="4" fill="#00f0ff" opacity="0.9" />
    <!-- 右上角光点 -->
    <circle cx="190" cy="64" r="3" fill="#00f0ff" opacity="0.7" />
  </g>
</svg>
