name: Test & Release

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # 生成 backend/dist（test 插件 tsc 需要解析 @mqn00/file-manager 的 types）
      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 生成 plugins/test/dist（loader.watch 测试加载本地插件依赖，dist 被 .gitignore 忽略）
      - name: Install test plugin dependencies
        working-directory: plugins/test
        run: npm ci

      - name: Build test plugin
        working-directory: plugins/test
        run: npm run build

      # E2E 依赖 compress 插件（压缩任务测试 + 插件管理页测试），dist 被 .gitignore 忽略需显式构建
      - name: Install compress plugin dependencies
        working-directory: plugins/compress
        run: npm ci

      - name: Build compress plugin
        working-directory: plugins/compress
        run: npm run build

      # --coverage：provider v8、reporter 含 lcov，产出 <pkg>/coverage/lcov.info
      # （见 backend/vitest.config.ts 与 frontend/vitest.config.ts）
      - name: Backend unit/integration tests
        working-directory: backend
        run: npx vitest run --coverage

      - name: Frontend component tests
        working-directory: frontend
        run: npx vitest run --coverage

      # 覆盖率上传：分两次上传，用 flags 区分后端/前端，
      # 便于在 Codecov 上分别查看与配置各自的状态检查。
      # 放在单测之后、E2E 之前：E2E 失败也不会丢掉已产出的覆盖率报告。
      # fail_ci_if_error 保持 false——fork 发起的 PR 拿不到 CODECOV_TOKEN，
      # 上传失败只告警，不阻断流水线。
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage/lcov.info
          disable_search: true
          flags: backend
          name: backend
          fail_ci_if_error: false

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          disable_search: true
          flags: frontend
          name: frontend
          fail_ci_if_error: false

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test --config e2e/playwright.config.ts

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # gh workflow run 触发 publish/deploy 需要 actions 写权限
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: npm run install:all

      - name: Package
        if: steps.check_tag.outputs.exists == 'false'
        run: npm run package

      - name: Build Electron
        if: steps.check_tag.outputs.exists == 'false'
        run: npm run electron:build

      - name: Extract changelog
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk "/^## v$VERSION/{flag=1; print; next} /^## / && flag{exit} flag" CHANGELOG.md > /tmp/changelog.md
          echo "--- changelog preview ---"
          cat /tmp/changelog.md

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: /tmp/changelog.md
          files: |
            file-manager.tar.gz
            release/*.AppImage
            release/*.deb
          generate_release_notes: false

      # GITHUB_TOKEN 创建的 tag 不会触发其他 workflow 的 push:tags 事件，
      # 因此显式触发 publish（npm）与 deploy（GitHub Pages）
      - name: Trigger publish to npm
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref ${{ github.ref_name }}

      - name: Trigger deploy to GitHub Pages
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-gh-pages.yml --ref ${{ github.ref_name }}
